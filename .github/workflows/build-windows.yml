name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Engine self-test
        run: python tests/selftest.py

      - name: UI smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/selftest.py --ui

      - name: Build LabDream.exe
        run: pyinstaller --noconfirm --clean labdream.spec

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\labdream.iss'

      - name: Zip portable version
        shell: pwsh
        run: Compress-Archive -Path dist\LabDream\* -DestinationPath LabDream_2.0_portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LabDream-Windows-2.0
          path: |
            installer/Output/LabDream_Setup_2.0.exe
            LabDream_2.0_portable.zip
