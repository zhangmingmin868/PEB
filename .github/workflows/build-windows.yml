name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Engine self-test
        run: python tests/selftest.py

      - name: UI smoke test (offscreen)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        # The offscreen Qt plugin can crash while the process unloads on Windows
        # (after all tests have finished). The test writes a marker file only
        # when every check passed, so judge the step by that marker.
        run: |
          Remove-Item selftest_passed.txt -ErrorAction SilentlyContinue
          python tests/selftest.py --ui
          Write-Host "selftest process exit code $LASTEXITCODE"
          if (-not (Test-Path selftest_passed.txt)) { Write-Error "UI self-test failed"; exit 1 }
          exit 0

      - name: PBE validation (FDA example + Excel workbook)
        run: |
          pip install scipy
          python tests/validate_pbe.py

      - name: Build LabDream.exe
        run: pyinstaller --noconfirm --clean labdream.spec

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\labdream.iss'

      - name: Zip portable version
        shell: pwsh
        run: Compress-Archive -Path dist\LabDream\* -DestinationPath LabDream_3.0_portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LabDream-Windows-3.0
          path: |
            installer/Output/LabDream_Setup_3.0.exe
            LabDream_3.0_portable.zip

      - name: Publish release (public download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0-build-${{ github.run_number }}
          name: LabDream Version 3.0 (APSD + PBE) - build ${{ github.run_number }}
          body: Windows installer and portable version built from ${{ github.sha }}.
          files: |
            installer/Output/LabDream_Setup_3.0.exe
            LabDream_3.0_portable.zip
